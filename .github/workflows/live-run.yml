name: live-run

# Daily blended forecast from the newest 00 UTC ECMWF IFS, ECMWF AIFS and NOAA GFS runs (blend/live.py).
# Each run verifies the earlier live forecasts against today's analysis, updates the online weights
# (models/live_state.nc) and commits a new bundle under bundles/runs/live-YYYYMMDD (the last 10 are kept).
# Also runnable by hand: Actions tab -> live-run -> Run workflow.
on:
  workflow_dispatch:
  schedule:
    - cron: "30 9 * * *"   # 09:30 UTC = 15:00 IST, after the 00 UTC open data (Day 10) is complete

permissions:
  contents: write

concurrency:
  group: live-run
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-live.txt
      - run: pip install -r requirements-live.txt
      - run: python -m blend.live run --bundles bundles --work /tmp/live_work
      - name: Commit the new bundle and online state
        run: |
          git config user.name "live-run bot"
          git config user.email "actions@users.noreply.github.com"
          git add bundles models/live_state.nc 2>/dev/null || git add bundles
          git commit -m "Live run $(date -u +%F)" || { echo "nothing to commit"; exit 0; }
          git pull --rebase
          git push
