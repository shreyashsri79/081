name: live-run

# Daily blended forecast from today's ECMWF IFS + AIFS open data (blend/live.py).
# Needs models/live_model.nc in the repo (python -m blend.live build-model --art <artifacts>).
# Manual for now: Actions tab -> live-run -> Run workflow. Uncomment `schedule` to run every day.
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "30 9 * * *"   # 09:30 UTC = 15:00 IST, after the 00 UTC open data is complete

permissions:
  contents: write

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-live.txt
      - run: python -m blend.live run --bundles bundles
      - name: Commit the new bundle
        run: |
          git config user.name "live-run bot"
          git config user.email "actions@users.noreply.github.com"
          git add bundles
          git commit -m "Live run $(date -u +%F)" || echo "nothing to commit"
          git pull --rebase
          git push
